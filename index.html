  {min:1000000, name:'大师', bullets:6, pierce:true, explode:true, autoAim:true},
  {min:5000000, name:'传奇', bullets:8, pierce:true, explode:true, autoAim:true},
];
function getPrivilege(s){
  let p=PRIVILEGES[0];
  for(const pr of PRIVILEGES){ if(s>=pr.min) p=pr; }
  return p;
}
/* ==================== 愤怒的小鸟：积木类型 ==================== */
// 红鸟(普通) 黄鸟(加速) 黑鸟(爆炸) 蓝鸟(分裂) 白鸟(下蛋)
const BIRDS=[
  {type:'red', name:'红鸟', emoji:'🐦', color:'#FF4757', effect:'normal', weight:40},
  {type:'yellow', name:'黄鸟', emoji:'🐤', color:'#FFA502', effect:'speed', weight:25},
  {type:'black', name:'黑鸟', emoji:'🐦‍⬛', color:'#2F3542', effect:'explode', weight:15},
  {type:'blue', name:'蓝鸟', emoji:'🐦', color:'#70A1FF', effect:'split', weight:12},
  {type:'white', name:'白鸟', emoji:'🕊️', color:'#F1F2F6', effect:'egg', weight:8},
];
function pickBird(){
  const total=BIRDS.reduce((s,b)=>s+b.weight,0);
  let r=Math.random()*total;
  for(const b of BIRDS){ r-=b.weight; if(r<=0) return b; }
  return BIRDS[0];
}
/* ==================== 工具 ==================== */
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const lerp = (a,b,t)=>a+(b-a)*t;
const deg2rad = d=>d*Math.PI/180;
const chargeCurve = t=>Math.pow(clamp(t,0,1), CFG.chargePower);
/* ==================== 得分倍率系统 ==================== */
// 段位：分数越高，全局倍率越大
const TIERS=[
  {min:0, name:'凡人', mult:1},
  {min:1000, name:'初出茅庐', mult:1.5},
  {min:10000, name:'小有名气', mult:2},
  {min:100000, name:'登堂入室', mult:3},
  {min:1000000, name:'炉火纯青', mult:5},
  {min:10000000, name:'登峰造极', mult:10},
];
function getTier(s){
  let t=TIERS[0];
  for(const tier of TIERS){ if(s>=tier.min) t=tier; }
  return t;
}
// 连击倍率：按分段取最高档
function getComboMult(combo){
  let m=1;
  for(const [c,mult] of CFG.comboTiers){ if(combo>=c) m=mult; }
  return m;
}
function roundRect(ctx,x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
/* ==================== Canvas 适配 ==================== */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let scale=1, offX=0, offY=0;
function resize(){
  const dw=window.innerWidth, dh=window.innerHeight;
  scale=Math.min(dw/CFG.W, dh/CFG.H);
  canvas.width=CFG.W*scale; canvas.height=CFG.H*scale;
  ctx.setTransform(scale,0,0,scale,0,0);
}
window.addEventListener('resize',resize); resize();
/* 屏幕坐标 -> 设计坐标(中心原点) */
function toWorld(clientX, clientY){
  const r=canvas.getBoundingClientRect();
  const x=(clientX-r.left)/scale - CFG.W/2;
  const y=CFG.H/2 - (clientY-r.top)/scale;
  return {x,y};
}
/* ==================== 音频 ==================== */
let actx=null, muted=false;
function ensureAudio(){ if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } }
function tone(freq,dur,type='sine',gain=0.3){
  if(muted||!actx) return;
  const t=actx.currentTime;
  const o=actx.createOscillator(), g=actx.createGain();
  o.type=type; o.frequency.setValueAtTime(freq,t);
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(gain,t+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(actx.destination);
  o.start(t); o.stop(t+dur+0.02);
}
// 噪声缓冲（用于落地闷响）
let noiseBuf=null;
function getNoise(){
  if(!noiseBuf && actx){
    noiseBuf=actx.createBuffer(1,actx.sampleRate*0.2,actx.sampleRate);
    const d=noiseBuf.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2);
  }
  return noiseBuf;
}
function thud(){
  if(muted||!actx) return;
  const t=actx.currentTime;
  const src=actx.createBufferSource();
  src.buffer=getNoise();
  const g=actx.createGain(), f=actx.createBiquadFilter();
  f.type='lowpass'; f.frequency.value=400;
  g.gain.setValueAtTime(0.4,t);
  g.gain.exponentialRampToValueAtTime(0.001,t+0.15);
  src.connect(f); f.connect(g); g.connect(actx.destination);
  src.start(t);
}
const sfx={
  success:()=>{ thud(); tone(660,0.1,'triangle',0.2); },
  miss:()=>tone(140,0.25,'sawtooth',0.14),
  click:()=>tone(520,0.05,'square',0.1),
  combo:(c)=>{
    thud();
    const f=CFG.comboBaseFreq+Math.min(c,12)*CFG.comboFreqStep;
    tone(f,0.14,'square',0.2);
    setTimeout(()=>tone(f*1.5,0.12,'triangle',0.18),30);
    if(c>=5) setTimeout(()=>tone(f*2,0.1,'sine',0.14),60);
  },
  unlock:()=>{ tone(880,0.08,'triangle',0.2); setTimeout(()=>tone(1175,0.1,'triangle',0.2),60); setTimeout(()=>tone(1568,0.16,'sine',0.18),120); }
};
/* ==================== 存档 ==================== */

  // 等级与经验

  set level(v){ localStorage.setItem('qs_lv',String(v)); },
  get exp(){ return parseInt(localStorage.getItem('qs_exp')||'0',10); },
  set exp(v){ localStorage.setItem('qs_exp',String(Math.max(0,v))); },
  // 皮肤

  set skins(v){ localStorage.setItem('qs_skins',JSON.stringify(v)); },
  get activeSkin(){ return localStorage.getItem('qs_askin')||'default'; },

  get checkinDate(){ return localStorage.getItem('qs_cdate')||''; },
  set checkinDate(v){ localStorage.setItem('qs_cdate',v); },
  // 成就
  get achievements(){ try{return JSON.parse(localStorage.getItem('qs_ach')||'[]')}catch(e){return[]} },
  set achievements(v){ localStorage.setItem('qs_ach',JSON.stringify(v)); },
  // 统计

  set bestCombo(v){ localStorage.setItem('qs_bc',String(v)); },

  // 新手教程
  get tutorialDone(){ return localStorage.getItem('qs_td')==='1'; },
  set tutorialDone(v){ localStorage.setItem('qs_td',v?'1':'0'); },
};
muted=Save.muted;
/* ==================== 游戏状态 ==================== */
let state='start'; // start | playing | settlement
let tutorialStep=0; // 0=无教程, 1=按住蓄力, 2=松手发射, 3=落到平台
let tutorialActive=false;

/* ==================== 实时任务系统 ==================== */

function getShichen(){
  const h=new Date().getHours();
  for(let i=0;i<12;i++){
    const s=SHICHEN[i], e=SHICHEN[(i+1)%12].hour;

}

/* ==================== 平台 ==================== */
function spawnPlatform(){
  const tier=Math.floor(score/CFG.diffStep);
  const wStep=(CFG.pBaseW-CFG.pMinW)/7;
  let w=Math.max(CFG.pMinW, CFG.pBaseW-tier*wStep);
  // 永久升级：广阔天地
  w *= (1 + UPGRADES.find(u=>u.id==='widerPlatform').effect(upgLv('widerPlatform')));
  // 高手模式：平台变窄
  if(MODES[gameMode].platformNarrow) w *= MODES[gameMode].platformNarrow;
  if(frenzy>0) w*=1.6;
  const sStep=CFG.pMaxSpaceGrow/7;
  const sp=Math.min(CFG.pBaseSpace+CFG.pMaxSpaceGrow, CFG.pBaseSpace+tier*sStep);
  const oStep=CFG.pMaxOffGrow/7;
  const off=Math.min(CFG.pOffBase+CFG.pMaxOffGrow, CFG.pOffBase+tier*oStep);
  const top=platforms[platforms.length-1];
  const y=top?top.y+sp:CFG.launchY+CFG.pStartY;
  // 五行属性：循环五行
  const wx = WUXING[platforms.length % 5];
  const prevX=top?top.x:CFG.pCenterX;
  const prevW=top?top.w:w;
  const minOv=Math.min(w,prevW)*0.22;
  const dir=Math.random()<0.5?-1:1;
  let x=prevX+dir*off;
  const maxL=prevX+prevW/2-minOv-w/2;
  const maxR=prevX-prevW/2+minOv+w/2;
  x=Math.max(maxL,Math.min(maxR,x));
  const half=CFG.W/2;
  x=Math.max(-half+w/2+20, Math.min(half-20,x));
  platforms.push({x,y,w,flash:0,wx});
  // 结构上移：让最高平台保持在屏幕上部 30% 处（非累加，避免推出屏幕）
  const targetY = CFG.H * 0.22 - CFG.H / 2;
  if(y > targetY){ scrollOffset = y - targetY; }
}

/* 每日任务更新 */
function updateTask(type,val){
  for(const t of dailyTasks){
    if(t.type===type && !t.done){
      t.progress=Math.max(t.progress,val);
      if(t.progress>=t.target){ t.done=true; coins+=t.reward; Save.coins=coins; }
    }
  }
}

/* ==================== 弹道预览 ==================== */
function sampleTrajectory(speed,angle){
  const pts=[];
  const sx=CFG.launchX, sy=CFG.launchY+scrollOffset;
  const vx=speed*Math.cos(angle), vy=speed*Math.sin(angle);
  const dt=CFG.trajTime/CFG.trajCount;
  for(let i=0;i<=CFG.trajCount;i++){
    const t=i*dt;
    pts.push({x:sx+vx*t, y:sy+vy*t-0.5*CFG.gravity*t*t});
  }
  return pts;
}

function fire(){
  if(!canLaunch||state!=='playing') return;
  if(charge<CFG.minChargeRatio){ canLaunch=true; return; }
  canLaunch=false;
  const speed=charge*CFG.maxSpeed;
  const vx=speed*Math.cos(aimAngle), vy=speed*Math.sin(aimAngle);
  const priv = getPrivilege(score);
  const projWx = WUXING[Math.floor(Math.random()*5)];
  // 主子弹
  const bird = pickBird();
  let mainSpeed = speed;
  if(bird.effect==='speed') mainSpeed *= 1.6; // 黄鸟加速
  projectile={x:CFG.launchX,y:CFG.launchY+scrollOffset,
    vx:mainSpeed*Math.cos(aimAngle), vy:mainSpeed*Math.sin(aimAngle),
    settled:false,dead:false,rot:0,wx:projWx,bird:bird,pierce:priv.pierce,explode:priv.explode,
    pierceCount:priv.pierce?3:0, eggT:bird.effect==='egg'?0.5:0};
  // 多发子弹散射
  extraProjectiles=[];
  const n = priv.bullets-1;
  for(let i=0;i<n;i++){
    const spread = (i+1) * 0.06 * (i%2===0?1:-1); // 散射角度
    const ang = aimAngle + spread;
    const b2 = pickBird();
    extraProjectiles.push({x:CFG.launchX,y:CFG.launchY+scrollOffset,
      vx:speed*Math.cos(ang), vy:speed*Math.sin(ang),
      settled:false,dead:false,rot:0,wx:WUXING[Math.floor(Math.random()*5)],
      bird:b2,pierce:priv.pierce,explode:priv.explode,pierceCount:priv.pierce?3:0,
      eggT:b2.effect==='egg'?0.5:0, isExtra:true});
  }
  // 蓝鸟分裂：主子弹额外分裂2颗
  if(bird.effect==='split'){
    for(let i=0;i<2;i++){
      const ang = aimAngle + (i===0?0.1:-0.1);
      extraProjectiles.push({x:CFG.launchX,y:CFG.launchY+scrollOffset,
        vx:speed*0.85*Math.cos(ang), vy:speed*0.85*Math.sin(ang),
        settled:false,dead:false,rot:0,wx:projWx,bird:bird,pierce:false,explode:false,
        pierceCount:0,eggT:0,isExtra:true});
    }
  }
  if(reviveAim){ reviveAim=false; }
}

function checkLanding(){
  // 主子弹
  if(projectile && !projectile.settled){
    checkOneLanding(projectile, false);
  }
  // 额外子弹
  for(let i=extraProjectiles.length-1;i>=0;i--){
    const p=extraProjectiles[i];
    if(!p.settled) checkOneLanding(p, true);
    if(p.settled || p.dead) extraProjectiles.splice(i,1);
  }
}
function checkOneLanding(p, isExtra){
  if(p.vy>0) return; // 必须下落
  const bx=p.x, by=p.y;
  for(const plat of platforms){
    const hw=plat.w/2+CFG.pTol;
    const topY=plat.y+CFG.pHeight/2;
    if(Math.abs(bx-plat.x)<=hw && by-CFG.blockSize/2<=topY && by-CFG.blockSize/2>topY-30){
      // 穿透特权：穿过平台继续飞
      if(p.pierce && p.pierceCount>0){
        p.pierceCount--;
        // 穿透也得分（小额）
        const tiny = Math.floor(CFG.baseScore*0.3*getComboMult(combo));
        score += tiny;
        floatTexts.push({text:`穿透 +${tiny}`,x:bx,y:by,vy:-60,life:0.6,max:0.6,color:'#70A1FF',size:16});
        // 穿透粒子
        for(let j=0;j<8;j++){ const a=Math.random()*Math.PI*2, sp=40+Math.random()*100;
          particles.push({x:bx,y:by,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:0.3+Math.random()*0.3,max:0.6,size:2+Math.random()*3,color:'#70A1FF'}); }
        return; // 继续飞
      }
      // 爆炸特权：落地爆炸，清除周围食物/金币
      if(p.explode || (p.bird && p.bird.effect==='explode')){
        doExplosion(bx, by, 120);
      }
      p.settled=true;
      p.vx=0; p.vy=0;
      p.y=plat.y+CFG.pHeight/2+CFG.blockSize/2;
      if(isExtra){
        // 额外子弹只加分，不建平台
        const g = Math.floor(CFG.baseScore*0.5*getComboMult(combo)*getTier(score).mult);
        score += g;
        floatTexts.push({text:`+${g}`,x:bx,y:p.y,vy:-70,life:0.7,max:0.7,color:'#FFD764',size:18});
      } else {
        onSuccess(bx,p.y);
      }
      return;
    }
  }
}

    particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:0.4+Math.random()*0.5,max:0.9,size:3+Math.random()*6,color:['#FF4757','#FFA502','#FFD700','#fff'][i%4]}); }
  // 清除范围内食物
  for(let i=foods.length-1;i>=0;i--){
    const f=foods[i]; const dx=f.x-x, dy=f.y-y;
    if(dx*dx+dy*dy < radius*radius){
      eatFood(f); foods.splice(i,1);
    }
  }
  // 清除范围内金币
  for(let i=coinsRain.length-1;i>=0;i--){
    const c=coinsRain[i]; const dx=c.x-x, dy=c.y-y;
    if(dx*dx+dy*dy < radius*radius){
      coins += c.value; Save.coins=coins;
      coinsRain.splice(i,1);
    }
  }
}
/* ==================== 成功 / 失败 ==================== */
function onSuccess(x,y){
  // 教程完成
  if(tutorialActive && tutorialStep===3){
    tutorialActive=false; tutorialStep=0;
    Save.tutorialDone=true;
    coins+=50; Save.coins=coins;
    floatTexts.push({text:'🎉 教程完成 +50金币',x:0,y:100,vy:-40,life:2,max:2,color:'#1DD1A1',size:30,scale:1.4,big:true});
    sfx.unlock();
  }
  combo++;
  updateLiveTask('combo',1);
  if(perfect) updateLiveTask('perfect',1);
  if(combo>maxCombo) maxCombo=combo;
  if(settled.length>maxSnakeLen) maxSnakeLen=settled.length;
  snakeDir = aimAngle;
  const top=platforms[platforms.length-1];
  const distFromCenter = top ? Math.abs(x - top.x) : 999;
  const perfect = top && distFromCenter < top.w*0.15;
  // 跳一跳：连续完美命中（跳一跳连跳）
  if(perfect){
    jumpCombo++;
    if(jumpCombo>maxJumpCombo) maxJumpCombo=jumpCombo;
  } else {
    jumpCombo = 0;
  }
  const jumpBonus = perfect ? jumpCombo * CFG.baseScore * 2 : 0;
  if(jumpCombo>=3 && perfect){
    floatTexts.push({text:`跳一跳 x${jumpCombo}! +${jumpBonus}`,x,y:y-20,vy:-90,life:1.0,max:1.0,color:'#00F5FF',size:24,scale:1.2});
  }
  // 五行判定：积木五行 vs 平台五行
  const projWx = projectile.wx || '金';
  const platWx = top ? top.wx : '金';
  let wxBonus=0, wxText='';
  if(projWx===platWx){ wxBonus=1; wxText='同属·+1'; }
  else if(WX_SHENG[projWx]===platWx){ wxBonus=3; wxText='相生·+3'; } // 我生平台
  else if(WX_SHENG[platWx]===projWx){ wxBonus=2; wxText='被生·+2'; } // 平台生我
  else if(WX_KE[projWx]===platWx){ wxBonus=-1; wxText='相克·-1'; } // 我克平台
  else if(WX_KE[platWx]===projWx){ wxBonus=-2; wxText='被克·-2'; } // 平台克我
  const mult = getComboMult(combo);
  // 段位倍率：分数越高倍率越大
  const tier=getTier(score);
  // 连击大师升级
  const comboBoost = UPGRADES.find(u=>u.id==='comboBoost').effect(upgLv('comboBoost'));
  // 完美命中：基础分翻倍 + 额外大奖
  const perfectBonus = perfect ? CFG.baseScore*3 : 0;
  let gained = CFG.baseScore*mult*(1+comboBoost)*tier.mult + perfectBonus + wxBonus*mult + jumpBonus;
  if(doubleScore) gained*=2;
  // 狂暴模式：分数×5
  if(frenzy>0) gained*=5;
  // 幸运一击：暴击
  const critRate = UPGRADES.find(u=>u.id==='critRate').effect(upgLv('critRate'));
  let isCrit=false;
  if(Math.random()<critRate){ gained*=2; isCrit=true; }
  // 高手模式：得分1.5倍
  if(MODES[gameMode].scoreMult) gained*=MODES[gameMode].scoreMult;
  gained = Math.max(1, Math.floor(gained));
  score += gained;
  updateLiveTask('score',gained);
  if(isCrit) floatTexts.push({text:'暴击！',x:x,y:y+30,vy:-60,life:0.8,max:0.8,color:'#FF4757',size:22,scale:1.3});
  // 子午流注时辰buff
  const sc=getShichen();
  let shichenBonus=0;
  if(sc.buff==='睡眠加分') shichenBonus=2;
  else if(sc.buff==='连击加成') shichenBonus = combo>=3?2:0;
  else if(sc.buff==='完美加成') shichenBonus = perfect?3:0;
  else if(sc.buff==='金币翻倍') shichenBonus=0; // 金币翻倍在下面
  if(shichenBonus>0){ score+=shichenBonus; }
  // 金币：每分+1金币，完美额外+5
  const coinGain = (gained+shichenBonus) * (sc.buff==='金币翻倍'?2:1) + (perfect?5:0) + (frenzy>0?gained:0);
  coins += coinGain; Save.coins = coins;
  if(score>hiScore){ hiScore=score; Save.hi=hiScore; newRecordT=1.6; }
  // 狂暴模式：连击达到10触发，分数×5，同时触发金币雨
  if(combo>=10 && frenzy<=0){
    frenzy = 10;
    screenFlash=0.9;
    floatTexts.push({text:'🔥 狂暴！分数×5',x,y:y+100,vy:-60,life:2,max:2,color:'#ff3366',size:50,scale:1.6,big:true});
    sfx.unlock();
    if(coinRainT<=0) startCoinRain(5); // 狂暴必带金币雨
  }
  // 连击里程碑：高分段也触发
  if(combo===15||combo===20||combo===30||combo===50){
    floatTexts.push({text:`🔥 ${combo}连击！`,x,y:y+60,vy:-50,life:1.5,max:1.5,color:'#FFD700',size:36+combo*0.3,scale:1.3,big:true});
    screenFlash=Math.max(screenFlash,0.4);
    // 高连击触发金币雨
    if(combo>=20 && coinRainT<=0){
      startCoinRain(combo>=50?8:combo>=30?6:4);
    }
  }
  // 命中停顿
  hitstop = Math.min(0.14, 0.04 + combo*0.008 + (frenzy>0?0.03:0));
  screenFlash = perfect ? 0.6 : Math.min(0.5, 0.15+combo*0.04);
  camShake = Math.min(24, 4+combo*1.5+(frenzy>0?6:0)); shakeT = 0.12+combo*0.01;
  if(top) top.flash=CFG.flashDur;
  if(combo>=3) sfx.combo(combo); else sfx.success();
  if(perfect) sfx.unlock();
  // 浮动得分文字
  const label = perfect ? '完美' : (wxText ? wxText : '');
  floatTexts.push({
    text: label ? `${label} +${gained}` : `+${gained}`,
    x, y, vy:-80, life:1.0, max:1.0,
    color: perfect ? '#FFD764' : (wxBonus>0?'#88ff88':wxBonus<0?'#ff8888':'#ffffff'),
    size: perfect?34:26,
    scale: perfect?1.3:1.0
  });
  // 金币浮字
  floatTexts.push({text:`💰+${coinGain}`,x:x+50,y:y+20,vy:-70,life:0.8,max:0.8,color:'#ffd700',size:18,scale:1});
  // 连击里程碑
  if(combo===3||combo===5||combo===10||combo===15){
    floatTexts.push({
      text:`连击 x${combo}!`, x, y:y+60, vy:-120, life:1.4, max:1.4,
      color:'#FF6E40', size:48, scale:1.5, big:true
    });
  }
  // 大粒子爆炸
  const baseN = perfect ? 30 : 12;
  const n = baseN + combo*3 + (frenzy>0?20:0);
  const colors = perfect ? ['#FFD764','#FF9800','#FF6E40'] : (frenzy>0?['#ff3366','#ff6699','#ffcc00']:['#78c8ff','#a0e0ff','#ffffff']);
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2;
    const sp=(60+Math.random()*280)*(1+combo*0.05);
    particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp+80,life:0.4+Math.random()*0.6,max:1.0,size:2+Math.random()*5,color:colors[Math.floor(Math.random()*colors.length)]});
  }
  // 固定积木
  settledBlocks.push({x,y,color:perfect?'#FFD764':(frenzy>0?'#ff3366':(WX_COLOR[projWx]||skinColor)),perfect,wx:projWx});
  spawnPlatform();
  // 八卦道具掉落：20%几率，狂暴模式下50%
  if(Math.random() < (frenzy>0?0.5:0.2)){
    const guas=Object.keys(BAGUA);
    const type=guas[Math.floor(Math.random()*guas.length)];
    items.push({x,y:y-30,type,r:20,pulse:0,life:12,bagua:true});
  }
  // 皮肤消耗
  if(Save.skinUses>0){ Save.skinUses--; if(Save.skinUses<=0) skinColor='#FFD54F'; }
  // 更新任务
  updateTask('score',score);
  updateTask('combo',combo);
  updateTask('snake',settledBlocks.length);
  projectile.dead=true;
  setTimeout(()=>{canLaunch=true;},100);
}

/* 游戏结束结算：经验、升级、成就 */
let gameFinished=false;
function finishGame(){
  if(gameFinished) return;
  gameFinished=true;
  // 经验 = 得分（保底10）
  const expGain = Math.max(10, score);
  Save.exp = Save.exp + expGain;
  Save.totalGames = Save.totalGames + 1;
  if(maxCombo>Save.bestCombo) Save.bestCombo=maxCombo;
  // 升级
  let lv=Save.level;
  while(Save.exp >= lv*100){ Save.exp -= lv*100; lv++; }
  if(lv>Save.level){ Save.level=lv; levelUpFlash=3; }
  // 成就检测
  const achCtx={score,maxCombo,snake:settledBlocks.length,totalFortune:Save.totalFortune,
    roundDone,totalGames:Save.totalGames,level:Save.level,hi:hiScore};
  let achGained=0;
  const done=Save.achievements;
  for(const a of ACHIEVEMENTS){
    if(!done.includes(a.id) && a.cond(achCtx)){
      done.push(a.id); achGained+=a.reward;
    }
  }
  if(achGained>0){ Save.coins=Save.coins+achGained; coins=Save.coins; }
  Save.achievements=done;
}

/* ==================== 主循环 ==================== */
let last=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  update(dt);
  render();
  requestAnimationFrame(loop);
}
function update(dt){
  // 命中停顿：冻结物理但衰减特效计时
  if(hitstop>0){ hitstop-=dt; dt=0; }
  // 屏幕闪光衰减
  if(screenFlash>0) screenFlash=Math.max(0,screenFlash-dt*2.5);
  // 升级提示倒计时
  if(levelUpFlash>0) levelUpFlash-=dt;
  if(levelUpAnim>0) levelUpAnim-=dt;
  // 关卡检测 + Boss更新
  if(state==='playing'){
    checkLevelUp();
    if(boss && bossActive){
      boss.moveT += dt;
      boss.x = Math.sin(boss.moveT*1.2) * 200; // Boss左右移动
      boss.y = scrollOffset + 200 + Math.sin(boss.moveT*0.8)*60;
      if(boss.hitFlash>0) boss.hitFlash-=dt;
      boss.attackT -= dt;
      if(boss.attackT<=0){
        boss.attackT = 3;
        // Boss攻击：扣分+震动
        const dmg = 30 + level*10;
        score = Math.max(0, score - dmg);
        combo = 0; jumpCombo = 0;
        screenFlash = Math.max(screenFlash, 0.6);
        camShake = Math.max(camShake, 18); shakeT = 0.18;
        floatTexts.push({text:`${boss.emoji} 攻击 -${dmg}`,x:boss.x,y:boss.y+50,vy:-50,life:1.0,max:1.0,color:'#FF4757',size:22,scale:1.2});
      }
    }
  }
  // 限时模式倒计时
  if(state==='playing' && modeTimer>0){
    modeTimer-=dt;
    if(modeTimer<=0){ modeTimer=0; finishGame(); state='settlement'; buildButtons(); return; }
  }
  // 蓄力
  if(charging){
    chargeT=(chargeT||0)+dt;
    charge=chargeCurve(Math.min(1,chargeT/CFG.chargeTime));
  } else {
    chargeT=0; charge=0;
  }
  // 积木物理
  if(projectile && !projectile.settled && !projectile.dead){
    projectile.vy -= CFG.gravity*dt;
    projectile.x += projectile.vx*dt;
    projectile.y += projectile.vy*dt;
    projectile.rot += projectile.vx*0.001;
    // 拖尾
    trail.push({x:projectile.x,y:projectile.y,life:0.25,max:0.25});
    if(trail.length>20) trail.shift();
    // 磁铁：吸附食物
    if(magnet){
      for(const f of foods){
        const dx=projectile.x-f.x, dy=projectile.y-f.y;
        const d=Math.sqrt(dx*dx+dy*dy);
        const magnetRange = 200 * (1 + UPGRADES.find(u=>u.id==='magnetRange').effect(upgLv('magnetRange')));
        if(d<magnetRange && d>1){ f.x+=dx/d*300*dt; f.y+=dy/d*300*dt; }
      }
    }
    // 吃食物检测
    for(let i=foods.length-1;i>=0;i--){
      const f=foods[i];
      const dx=projectile.x-f.x, dy=projectile.y-f.y;
      const pickupR = (f.r+CFG.blockSize/2) * (1 + UPGRADES.find(u=>u.id==='magnetRange').effect(upgLv('magnetRange'))*0.3);
      if(dx*dx+dy*dy < pickupR*pickupR){
        eatFood(f); foods.splice(i,1);
      }
    }
    // 金币拾取检测
    for(let i=coinsRain.length-1;i>=0;i--){
      const c=coinsRain[i];
      const dx=projectile.x-c.x, dy=projectile.y-c.y;
      const pickupR = c.r+CFG.blockSize/2+8;
      if(dx*dx+dy*dy < pickupR*pickupR){
        coins += c.value; Save.coins = coins;
        floatTexts.push({text:`💰+${c.value}`,x:c.x,y:c.y,vy:-100,life:0.7,max:0.7,color:'#FFD700',size:16+c.value*0.5,scale:1.1});
        // 金币粒子
        for(let j=0;j<6;j++){ const a=Math.random()*Math.PI*2, sp=30+Math.random()*80;
          particles.push({x:c.x,y:c.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp+30,life:0.3+Math.random()*0.3,max:0.6,size:2+Math.random()*3,color:'#FFD700'}); }
        coinsRain.splice(i,1);
        sfx.click();
      }
    }
    // 道具拾取检测
    for(let i=items.length-1;i>=0;i--){
      const it=items[i];
      const dx=projectile.x-it.x, dy=projectile.y-it.y;
      if(dx*dx+dy*dy < (it.r+CFG.blockSize/2)*(it.r+CFG.blockSize/2)){
        pickupItem(it); items.splice(i,1);
      }
    }
    checkLanding();
    if(projectile.y < -CFG.failOff){ onFail(); }
  } else {
    // 积木不在飞，拖尾淡出
    for(let i=trail.length-1;i>=0;i--){ trail[i].life-=dt; if(trail[i].life<=0) trail.splice(i,1); }
  }
  // 额外子弹物理 + 白鸟下蛋
  for(let i=extraProjectiles.length-1;i>=0;i--){
    const p=extraProjectiles[i];
    if(p.settled || p.dead) continue;
    p.vy -= CFG.gravity*dt;
    p.x += p.vx*dt; p.y += p.vy*dt;
    p.rot += p.vx*0.001;
    // 白鸟下蛋：飞行中定时释放小积木（直接加分）
    if(p.eggT && p.eggT>0){
      p.eggT -= dt;
      if(p.eggT<=0){
        p.eggT = 0.6;
        const egg = Math.floor(CFG.baseScore*0.8*getComboMult(combo)*getTier(score).mult);
        score += egg;
        floatTexts.push({text:`🥚+${egg}`,x:p.x,y:p.y,vy:-80,life:0.6,max:0.6,color:'#F1F2F6',size:16});
        for(let j=0;j<5;j++){ const a=Math.random()*Math.PI*2, sp=30+Math.random()*60;
          particles.push({x:p.x,y:p.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp+20,life:0.3+Math.random()*0.3,max:0.6,size:2+Math.random()*3,color:'#F1F2F6'}); }
      }
    }
    if(p.y < -CFG.failOff-200){ p.dead=true; }
  }
  // 食物更新
  for(let i=foods.length-1;i>=0;i--){
    const f=foods[i];
    f.pulse += dt*4;
    f.life -= dt;
    if(f.life<=0){ foods.splice(i,1); }
  }
  // 金币雨：生成 + 物理 + 回收
  if(coinRainT>0){
    coinRainT -= dt;
    coinRainSpawnT -= dt;
    // 每次生成多枚金币，营造"雨"的效果
    if(coinRainSpawnT<=0){
      coinRainSpawnT = 0.06;
      const batch = 2 + Math.floor(Math.random()*3);
      for(let i=0;i<batch;i++) spawnCoin();
    }
  }
  for(let i=coinsRain.length-1;i>=0;i--){
    const c=coinsRain[i];
    c.vy -= CFG.gravity*0.6*dt; // 金币重力比积木小，飘得久
    c.x += c.vx*dt;
    c.y += c.vy*dt;
    c.pulse += dt*8;
    // 左右边界反弹
    if(c.x < -CFG.W/2+20){ c.x=-CFG.W/2+20; c.vx*=-0.6; }
    if(c.x > CFG.W/2-20){ c.x=CFG.W/2-20; c.vx*=-0.6; }
    // 掉出屏幕下方回收
    if(c.y < scrollOffset - CFG.H/2 - 100 || c.y > scrollOffset + CFG.H/2 + 200){
      coinsRain.splice(i,1);
    }
  }
  /* ==================== 植物大战僵尸系统 ==================== */
  // 阳光生成：每隔一段时间掉落阳光（可拾取）
  sunSpawnT -= dt;
  if(sunSpawnT<=0){
    sunSpawnT = 6 + Math.random()*4;
    foods.push({x:(Math.random()-0.5)*CFG.W*0.7, y:scrollOffset+CFG.H/2+30, r:14, value:0,
      name:'阳光', emoji:'☀️', pulse:0, life:12, fortune:false, color:'#FFD700', isSun:true});
  }
  // 僵尸波次：分数越高，僵尸越强越频繁
  zombieSpawnT -= dt;
  const zombieInterval = Math.max(8, 25 - score/50000);
  if(zombieSpawnT<=0 && score>200){
    zombieSpawnT = zombieInterval;
    zombieWave++;
    const zType = zombieWave%5===0 ? 'boss' : 'normal';
    const baseY = scrollOffset + (Math.random()-0.3)*CFG.H*0.5;
    zombies.push({
      x: CFG.W/2 + 50, y: baseY,
      hp: zType==='boss' ? 8+zombieWave : 3+Math.floor(zombieWave/3),
      maxHp: zType==='boss' ? 8+zombieWave : 3+Math.floor(zombieWave/3),
      speed: zType==='boss' ? 15 : 25+zombieWave*0.5,
      type: zType, emoji: zType==='boss'?'🧟‍♂️':'🧟', attackT:0
    });
    floatTexts.push({text:`⚔️ 第${zombieWave}波僵尸来袭！`,x:0,y:150,vy:-20,life:2,max:2,color:'#2ED573',size:28,scale:1.3,big:true});
  }
  // 僵尸移动 + 攻击
  for(let i=zombies.length-1;i>=0;i--){
    const z=zombies[i];
    z.x -= z.speed*dt;
    z.attackT -= dt;
    // 僵尸到达积木塔区域，攻击
    const towerX = platforms.length>0 ? platforms[platforms.length-1].x : 0;
    if(z.x < towerX+CFG.blockSize){
      if(z.attackT<=0){
        z.attackT = 1.5;
        // 攻击：扣分 + 屏幕震动
        const dmg = z.type==='boss'? 50 : 15;
        score = Math.max(0, score - dmg);
        combo = 0; jumpCombo = 0;
        screenFlash = Math.max(screenFlash, 0.5);
        camShake = Math.max(camShake, 15); shakeT = 0.15;
        floatTexts.push({text:`-${dmg}`,x:z.x,y:z.y,vy:-60,life:0.8,max:0.8,color:'#FF4757',size:22,scale:1.2});
      }
    }
    // 僵尸飞出左侧
    if(z.x < -CFG.W/2 - 100) zombies.splice(i,1);
  }
  // 子弹击中僵尸 + Boss
  const allProjs = [projectile, ...extraProjectiles].filter(p=>p && !p.settled && !p.dead);
  for(const p of allProjs){
    // 击中Boss
    if(boss && bossActive){
      const dx=p.x-boss.x, dy=p.y-boss.y;
      if(dx*dx+dy*dy < (CFG.blockSize/2+40)*(CFG.blockSize/2+40)){
        const dmg = (p.explode?5:1) * (p.bird&&p.bird.effect==='explode'?3:1);
        damageBoss(dmg);
        if(!p.pierce || p.pierceCount<=0){
          if(p===projectile){ onFail(); }
          else { p.dead=true; }
        } else { p.pierceCount--; }
        continue;
      }
    }
    for(let i=zombies.length-1;i>=0;i--){
      const z=zombies[i];
      const dx=p.x-z.x, dy=p.y-z.y;
      if(dx*dx+dy*dy < (CFG.blockSize/2+18)*(CFG.blockSize/2+18)){
        z.hp -= (p.explode?3:1);
        // 击中粒子
        for(let j=0;j<8;j++){ const a=Math.random()*Math.PI*2, sp=40+Math.random()*100;
          particles.push({x:z.x,y:z.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:0.3+Math.random()*0.3,max:0.6,size:2+Math.random()*3,color:'#2ED573'}); }
        if(z.hp<=0){
          const zScore = z.type==='boss'? 500 : 100;
          score += zScore;
          coins += Math.floor(zScore*0.1); Save.coins=coins;
          floatTexts.push({text:`击杀僵尸 +${zScore}`,x:z.x,y:z.y,vy:-80,life:1.0,max:1.0,color:'#2ED573',size:22,scale:1.2});
          updateLiveTask('kill',1);
          totalZombies++;
          for(let j=0;j<15;j++){ const a=Math.random()*Math.PI*2, sp=60+Math.random()*150;
            particles.push({x:z.x,y:z.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:0.4+Math.random()*0.4,max:0.8,size:3+Math.random()*4,color:['#2ED573','#7BED9F','#fff'][j%3]}); }
          zombies.splice(i,1);
        }
        // 穿透子弹不消失
        if(!p.pierce || p.pierceCount<=0){
          if(p===projectile){ onFail(); }
          else { p.dead=true; }
        } else {
          p.pierceCount--;
        }
        break;
      }
    }
  }
  // 道具更新
  for(let i=items.length-1;i>=0;i--){
    const it=items[i];
    it.pulse += dt*5;
    it.life -= dt;
    it.y += Math.sin(it.pulse)*0.5;
    if(it.life<=0){ items.splice(i,1); }
  }
  // 增益倒计时
  if(magnetT>0){ magnetT-=dt; if(magnetT<=0) magnet=false; }
  if(doubleT>0){ doubleT-=dt; if(doubleT<=0) doubleScore=false; }
  if(shieldT>0 && shieldT<999){ shieldT-=dt; if(shieldT<=0) shield=false; }
  // 狂暴倒计时
  if(frenzy>0){ frenzy-=dt; if(frenzy<=0){ frenzy=0; } }
  // 技能冷却
  for(const k in skillCooldowns){ if(skillCooldowns[k]>0) skillCooldowns[k]-=dt; }
  // 实时任务倒计时
  if(liveTask){
    liveTaskTimer-=dt;
    if(liveTaskTimer<=0){ liveTask=null; setTimeout(()=>{ if(state==='playing') newLiveTask(); },2000); }
  }
  // 保持食物数量
  if(foods.length<3 && Math.random()<0.02) spawnFood();
  // 粒子
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.life-=dt;
    if(p.life<=0){ particles.splice(i,1); continue; }
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy-=400*dt;
  }
  // 浮动文字
  for(let i=floatTexts.length-1;i>=0;i--){
    const t=floatTexts[i];
    t.life-=dt;
    if(t.life<=0){ floatTexts.splice(i,1); continue; }
    t.y+=t.vy*dt; t.vy*=0.96;
  }
  // 环境粒子
  for(const a of ambient){
    a.y += a.s*dt;
    if(a.y > CFG.H/2+10){ a.y=-CFG.H/2-10; a.x=(Math.random()-0.5)*CFG.W; }
  }
  // 平台闪烁
  for(const p of platforms){ if(p.flash>0) p.flash-=dt; }
  // 震动
  if(shakeT>0){ shakeT-=dt; if(shakeT<=0) camShake=0; }
  // 复活提示倒计时
  if(reviveHintT>0){ reviveHintT-=dt; if(reviveHintT<=0) buildButtons(); }
  // 新纪录小提示倒计时
  if(newRecordT>0) newRecordT-=dt;
}
function render(){
  ctx.clearRect(0,0,CFG.W,CFG.H);
  ctx.save();
  // 震动
  let sx=0,sy=0;
  if(shakeT>0){ sx=(Math.random()-0.5)*camShake; sy=(Math.random()-0.5)*camShake; }
  ctx.translate(CFG.W/2+sx, CFG.H/2+sy);
  // 背景（使用预创建渐变）
  ctx.fillStyle=bgGrad;
  ctx.fillRect(-CFG.W/2,-CFG.H/2,CFG.W,CFG.H);
  // 环境粒子（背景星点）
  for(const a of ambient){
    ctx.globalAlpha=a.a;
    ctx.fillStyle=`hsl(${a.hue},70%,70%)`;
    ctx.beginPath(); ctx.arc(a.x,a.y,a.r,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1;
  // 光晕（使用预创建渐变）
  ctx.fillStyle=glowGrad1; ctx.fillRect(-CFG.W/2,-CFG.H/2,CFG.W,CFG.H);
  ctx.fillStyle=glowGrad2; ctx.fillRect(-CFG.W/2,-CFG.H/2,CFG.W,CFG.H);
  // 地面条
  ctx.fillStyle='#283250';
  ctx.fillRect(-CFG.W/2,-CFG.H/2,CFG.W,60);

  ctx.save();
  ctx.translate(0,-scrollOffset);
  // 平台（五行属性）
  for(const p of platforms){
    const flashing = p.flash>0;
    const wxColor = WX_COLOR[p.wx] || '#78c8ff';
    // 性能优化：去掉 shadowBlur，用亮色模拟发光
    ctx.fillStyle = flashing ? '#ffffff' : wxColor;
    roundRect(ctx,p.x-p.w/2,p.y-CFG.pHeight/2,p.w,CFG.pHeight,4);
    ctx.fill();
    // 顶面高光线
    ctx.fillStyle = flashing ? '#ffffff' : 'rgba(255,255,255,0.4)';
    roundRect(ctx,p.x-p.w/2+2,p.y-CFG.pHeight/2+1,p.w-4,3,1);
    ctx.fill();
    // 五行文字
    ctx.fillStyle='#1a1a2e';
    ctx.font='bold 11px sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(p.wx, p.x, p.y);
  }
  // 拖尾
  for(let i=0;i<trail.length;i++){
    const t=trail[i];
    const a=(t.life/t.max)*0.5;
    ctx.fillStyle=`rgba(255,215,100,${a})`;
    const sz=CFG.blockSize*0.5*(t.life/t.max);
    ctx.beginPath(); ctx.arc(t.x,t.y,sz,0,Math.PI*2); ctx.fill();
  }
  // 空中食物：十二生肖 / 人生福报 / 抖音礼物
  for(const f of foods){
    const p = 0.5+0.5*Math.sin(f.pulse);
    const r = f.r*(1+p*0.15);
    const isDragon = f.name==='龙';
    const isGift = !!f.gift;
    const isBigGift = isGift && f.level>=4;
    const isMegaGift = isGift && f.level>=6;
    const glowColor = isGift ? f.color : (f.fortune ? (f.color||'#fff') : (isDragon?'#FFD700':'#FFD764'));
    // 大礼物外光环（多层）
    if(isBigGift){
      for(let ring=3;ring>=1;ring--){
        ctx.shadowColor=glowColor; ctx.shadowBlur=20+p*15;
        ctx.fillStyle=`${f.color}${Math.floor(40/ring).toString(16).padStart(2,'0')}`;
        ctx.beginPath(); ctx.arc(f.x,f.y,r*(1+ring*0.4),0,Math.PI*2); ctx.fill();
      }
      // 顶级礼物旋转光圈
      if(isMegaGift){
        ctx.save(); ctx.translate(f.x,f.y); ctx.rotate(performance.now()*0.003);
        ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.shadowColor='#FFD700'; ctx.shadowBlur=20;
        ctx.beginPath();
        for(let i=0;i<6;i++){ const a=i*Math.PI/3; ctx.moveTo(Math.cos(a)*r*1.6,Math.sin(a)*r*1.6); ctx.lineTo(Math.cos(a)*r*2.2,Math.sin(a)*r*2.2); }
        ctx.stroke(); ctx.restore();
      }
    }
    ctx.shadowColor=glowColor; ctx.shadowBlur=isBigGift?25+p*15:15+p*10;
    ctx.fillStyle= isGift ? `${f.color}aa` : (f.fortune ? `${f.color}66` : (isDragon?'rgba(255,215,0,0.4)':'rgba(255,215,100,0.3)'));
    ctx.beginPath(); ctx.arc(f.x,f.y,r*1.5,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = isGift ? f.color : (f.fortune ? f.color : (isDragon ? '#FFD700' : '#FFE082'));
    ctx.beginPath(); ctx.arc(f.x,f.y,r,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur=0;
    // emoji（礼物更大）
    ctx.font=`${isGift?r*1.5:r*1.3}px sans-serif`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(f.emoji,f.x,f.y+1);
    // 礼物/福报显示名称
    if(isGift && f.level>=3){
      ctx.fillStyle='#fff'; ctx.strokeStyle='rgba(0,0,0,0.6)'; ctx.lineWidth=3;
      ctx.font=`bold ${isBigGift?14:11}px sans-serif`;
      ctx.strokeText(f.name,f.x,f.y+r+12);
      ctx.fillText(f.name,f.x,f.y+r+12);
    } else if(f.fortune && f.value>=12){
      ctx.fillStyle='#fff';
      ctx.font='bold 10px sans-serif';
      ctx.fillText(f.name,f.x,f.y+r+10);
    }
  }
  // 金币雨金币（金色发光硬币）
  for(const c of coinsRain){
    const p=0.5+0.5*Math.sin(c.pulse);
    const r=c.r*(1+p*0.1);
    const isBig=c.value>=5;
    ctx.shadowColor='#FFD700'; ctx.shadowBlur=isBig?20+p*10:10+p*6;
    // 外环光晕
    ctx.fillStyle=`rgba(255,215,0,${0.3+p*0.2})`;
    ctx.beginPath(); ctx.arc(c.x,c.y,r*1.5,0,Math.PI*2); ctx.fill();
    // 硬币主体（金色渐变）
    ctx.fillStyle='#FFD700';
    ctx.beginPath(); ctx.arc(c.x,c.y,r,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#FFA500';
    ctx.beginPath(); ctx.arc(c.x,c.y,r*0.7,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur=0;
    // ¥ 符号
    ctx.fillStyle='#fff';
    ctx.font=`bold ${r*0.9}px sans-serif`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('¥',c.x,c.y+1);
  }
  // 僵尸（植物大战僵尸）
  for(const z of zombies){
    const hpRatio = z.hp/z.maxHp;
    const size = z.type==='boss' ? 50 : 36;
    // 阴影
    ctx.fillStyle='rgba(0,0,0,0.3)';
    ctx.beginPath(); ctx.ellipse(z.x,z.y+size/2+4,size/2,6,0,0,Math.PI*2); ctx.fill();
    // 僵尸身体
    ctx.shadowColor='#2ED573'; ctx.shadowBlur=10;
    ctx.font=`${size}px sans-serif`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(z.emoji,z.x,z.y);
    ctx.shadowBlur=0;
    // 血条
    const bw=size*1.2, bh=5;
    ctx.fillStyle='rgba(0,0,0,0.5)';
    ctx.fillRect(z.x-bw/2,z.y-size/2-12,bw,bh);
    ctx.fillStyle = hpRatio>0.5?'#2ED573':hpRatio>0.25?'#FFA502':'#FF4757';
    ctx.fillRect(z.x-bw/2,z.y-size/2-12,bw*hpRatio,bh);
  }
  // Boss渲染
  if(boss && bossActive){
    const size=90;
    const flash = boss.hitFlash>0 ? 1 : 0;
    // Boss光晕
    ctx.shadowColor=boss.color; ctx.shadowBlur=30;
    ctx.fillStyle = flash ? '#fff' : boss.color;
    ctx.beginPath(); ctx.arc(boss.x,boss.y,size*0.7,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur=0;
    // Boss emoji
    ctx.font=`${size}px sans-serif`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(boss.emoji,boss.x,boss.y);
    // Boss血条（屏幕顶部）
    const bw=CFG.W*0.7, bh=14, bx=0-bw/2, by=CFG.H/2-180;
    ctx.fillStyle='rgba(0,0,0,0.6)';
    roundRect(ctx,bx,by,bw,bh,7); ctx.fill();
    const hpRatio = Math.max(0,boss.hp/boss.maxHp);
    ctx.fillStyle = hpRatio>0.5?'#2ED573':hpRatio>0.25?'#FFA502':'#FF4757';
    roundRect(ctx,bx,by,bw*hpRatio,bh,7); ctx.fill();
    ctx.strokeStyle='#fff'; ctx.lineWidth=1.5;
    roundRect(ctx,bx,by,bw,bh,7); ctx.stroke();
    ctx.fillStyle='#fff';
    ctx.font='bold 14px sans-serif';
    ctx.fillText(`${boss.name}  ${Math.ceil(boss.hp)}/${boss.maxHp}`,0,by-10);
  }
  // 掉落道具（八卦）
  for(const it of items){
    const def = it.bagua ? BAGUA[it.type] : ITEM_TYPES[it.type];
    const p=0.5+0.5*Math.sin(it.pulse);
    const r=it.r*(1+p*0.12);
    ctx.shadowColor=def.color; ctx.shadowBlur=18+p*8;
    ctx.fillStyle=def.color;
    ctx.beginPath(); ctx.arc(it.x,it.y,r,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur=0;
    // 内圈
    ctx.strokeStyle='rgba(255,255,255,0.6)'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.arc(it.x,it.y,r-3,0,Math.PI*2); ctx.stroke();
    // 八卦符号
    ctx.fillStyle='#fff';
    ctx.font=`bold ${r*0.9}px serif`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(def.emoji,it.x,it.y+1);
    // 剩余时间环
    const lifeRatio = it.life/12;
    ctx.strokeStyle='rgba(255,255,255,0.5)';
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.arc(it.x,it.y,r+6,-Math.PI/2,-Math.PI/2+Math.PI*2*lifeRatio);
    ctx.stroke();
  }
  // 蛇身连接线（相邻积木之间）——限制最多画50段，避免过长
  if(settledBlocks.length>1){
    ctx.strokeStyle='rgba(255,215,100,0.35)';
    ctx.lineWidth=CFG.blockSize*0.55;
    ctx.lineCap='round';
    ctx.beginPath();
    const start=Math.max(0,settledBlocks.length-50);
    ctx.moveTo(settledBlocks[start].x, settledBlocks[start].y);
    for(let i=start+1;i<settledBlocks.length;i++){
      ctx.lineTo(settledBlocks[i].x, settledBlocks[i].y);
    }
    ctx.stroke();
  }
  // 已固定积木（蛇身节）——去掉所有 shadowBlur，性能优化
  const n=settledBlocks.length;
  for(let i=0;i<n;i++){
    const b=settledBlocks[i];
    const isHead = (i===n-1);
    const t = n>1 ? i/(n-1) : 0;
    let bodyColor;
    if(b.perfect){ bodyColor='#FFD764'; }
    else { bodyColor = `hsl(${lerp(20,48,t)}, 90%, ${lerp(50,58,t)}%)`; }
    ctx.fillStyle=bodyColor;
    roundRect(ctx,b.x-CFG.blockSize/2,b.y-CFG.blockSize/2,CFG.blockSize,CFG.blockSize,8);
    ctx.fill();
    // 头部用亮色描边代替阴影
    if(isHead){
      ctx.strokeStyle='#FFD764'; ctx.lineWidth=2;
      roundRect(ctx,b.x-CFG.blockSize/2,b.y-CFG.blockSize/2,CFG.blockSize,CFG.blockSize,8);
      ctx.stroke();
    }
    // 高光
    ctx.fillStyle='rgba(255,255,255,0.22)';
    roundRect(ctx,b.x-CFG.blockSize/2+3,b.y-CFG.blockSize/2+3,CFG.blockSize-6,4,2);
    ctx.fill();
    // 蛇头：画眼睛
    if(isHead && n>0){
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.rotate(snakeDir);
      // 眼白
      const ex=8, ey=-6;
      ctx.fillStyle='#fff';
      ctx.beginPath(); ctx.arc(ex,ey,5,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(ex,-ey,5,0,Math.PI*2); ctx.fill();
      // 眼珠
      ctx.fillStyle='#1a1a2e';
      ctx.beginPath(); ctx.arc(ex+2,ey,2.5,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(ex+2,-ey,2.5,0,Math.PI*2); ctx.fill();
      ctx.restore();
    }
  }
  // 飞行中积木（五行属性 + 小鸟类型）
  function drawFlyingBlock(pr){
    const pwx = pr.wx || '金';
    const pColor = pr.bird ? pr.bird.color : (WX_COLOR[pwx] || skinColor);
    ctx.save();
    ctx.translate(pr.x,pr.y);
    ctx.rotate(pr.rot);
    ctx.fillStyle=pColor;
    roundRect(ctx,-CFG.blockSize/2,-CFG.blockSize/2,CFG.blockSize,CFG.blockSize,6);
    ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.3)';
    roundRect(ctx,-CFG.blockSize/2+3,-CFG.blockSize/2+3,CFG.blockSize-6,5,2);
    ctx.fill();
    // 五行字
    ctx.rotate(-pr.rot);
    ctx.fillStyle='#1a1a2e';
    ctx.font='bold 14px sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(pwx,0,2);
    // 小鸟emoji
    if(pr.bird){
      ctx.font='18px sans-serif';
      ctx.fillText(pr.bird.emoji,0,-CFG.blockSize/2-6);
    }
    ctx.restore();
  }
  if(projectile && !projectile.dead) drawFlyingBlock(projectile);
  for(const ep of extraProjectiles){ if(!ep.dead && !ep.settled) drawFlyingBlock(ep); }
  // 粒子（彩色）
  for(const p of particles){
    const a=p.life/p.max;
    ctx.globalAlpha=a;
    ctx.fillStyle=p.color||'#ffd764';
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.size*a,0,Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha=1;
  ctx.restore();

  // 发射点（阴阳太极图）
  const pulse = 0.5+0.5*Math.sin(performance.now()*0.005);
  ctx.shadowColor='#FF6E40'; ctx.shadowBlur=15+pulse*10;
  const lx=CFG.launchX, ly=CFG.launchY, R=22;
  // 太极底色
  ctx.fillStyle='#1a1a2e';
  ctx.beginPath(); ctx.arc(lx,ly,R,0,Math.PI*2); ctx.fill();
  // 阴（黑）阳（白）两仪
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.arc(lx,ly,R,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#1a1a2e';
  ctx.beginPath(); ctx.arc(lx,ly,R,Math.PI*0.5,Math.PI*1.5); ctx.fill();
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.arc(lx,ly-R/2,R/2,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#1a1a2e';
  ctx.beginPath(); ctx.arc(lx,ly+R/2,R/2,0,Math.PI*2); ctx.fill();
  // 阴阳鱼眼
  ctx.fillStyle='#1a1a2e';
  ctx.beginPath(); ctx.arc(lx,ly-R/2,4,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.arc(lx,ly+R/2,4,0,Math.PI*2); ctx.fill();
  ctx.shadowBlur=0;

  // 弹道预览（发光虚线）
  if(charging){
    const speed=charge*CFG.maxSpeed;
    const pts=sampleTrajectory(speed,aimAngle);
    const ratio=reviveAim?1:CFG.trajShow;
    const end=Math.floor(pts.length*ratio);
    ctx.strokeStyle='rgba(255,255,255,0.75)';
    ctx.lineWidth=3;
    ctx.setLineDash([8,8]);
    ctx.beginPath();
    ctx.moveTo(pts[0].x,pts[0].y);
    for(let i=1;i<end;i++) ctx.lineTo(pts[i].x,pts[i].y);
    ctx.stroke();
    ctx.setLineDash([]);
    const last=pts[end-1];
    ctx.fillStyle='rgba(255,255,255,0.95)';
    ctx.beginPath(); ctx.arc(last.x,last.y,6,0,Math.PI*2); ctx.fill();
  }

  // 浮动文字
  for(const t of floatTexts){
    const a = Math.min(1, t.life/0.3);
    const sc = t.scale * (t.big ? (1 + (1-t.life/t.max)*0.3) : 1);
    ctx.globalAlpha=a;
    ctx.font=`bold ${t.size*sc}px -apple-system,"PingFang SC",sans-serif`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.lineWidth=4; ctx.strokeStyle='rgba(0,0,0,0.6)';
    ctx.strokeText(t.text,t.x,t.y);
    ctx.fillStyle=t.color;
    ctx.fillText(t.text,t.x,t.y);
  }
  ctx.globalAlpha=1;
  ctx.restore();

  // 屏幕闪光覆盖
  if(screenFlash>0){
    ctx.fillStyle=`rgba(255,255,255,${screenFlash*0.5})`;
    ctx.fillRect(0,0,CFG.W,CFG.H);
  }
  // 狂暴模式红色边晕
  if(frenzy>0){
    const fa=0.15+0.1*Math.sin(performance.now()*0.01);
    const grd=ctx.createRadialGradient(CFG.W/2,CFG.H/2,CFG.H*0.3,CFG.W/2,CFG.H/2,CFG.H*0.7);
    grd.addColorStop(0,'rgba(255,0,60,0)');
    grd.addColorStop(1,`rgba(255,0,60,${fa})`);
    ctx.fillStyle=grd;
    ctx.fillRect(0,0,CFG.W,CFG.H);
  }

  // UI
  drawUI();
}

      const isDone=done.includes(a.id);
      const by=460-i*48;
      ctx.fillStyle = isDone?'rgba(155,89,182,0.2)':'rgba(255,255,255,0.05)';
      roundRect(ctx,-260,by-18,520,36,6); ctx.fill();
      drawText(`${isDone?'✅':'⬜'} ${a.name}`,-240,by,15,isDone?'#9B59B6':'#ccc','left');
      drawText(a.desc,30,by,12,'#888','left');
      drawText(`💰${a.reward}`,250,by,14,'#FFD764','right');
    });
    drawButtons();
  } else if(state==='modes'){
    ctx.fillStyle='rgba(10,12,24,0.96)';
    ctx.fillRect(-CFG.W/2,-CFG.H/2,CFG.W,CFG.H);
    drawText('🎮 选择模式',0,480,36,'#5a64c8');
    Object.keys(MODES).forEach((k,i)=>{
      const active=gameMode===k;
      const by=350-i*90;
      ctx.fillStyle = active?'rgba(255,110,64,0.15)':'rgba(255,255,255,0.05)';
      roundRect(ctx,-150,by-30,300,60,10); ctx.fill();
      drawText(MODES[k].name,0,by-5,18,active?'#FF6E40':'#fff');
      drawText(MODES[k].desc,0,by+15,12,'#888');
    });
    drawButtons();
  } else if(state==='wheel'){
    ctx.fillStyle='rgba(10,12,24,0.96)';
    ctx.fillRect(-CFG.W/2,-CFG.H/2,CFG.W,CFG.H);
    drawText('🎡 幸运转盘',0,500,36,'#EE5A6F');
    drawText(`消耗20金币  💰 ${coins}`,0,460,18,'#FFD764');
    // 转盘（简化：显示奖品列表）
    drawText('奖品',0,350,16,'#aaa');
    WHEEL_PRIZES.forEach((p,i)=>{
      drawText(`${p.label}`,-100,310-i*30,14,p.color,'left');
    });
    if(spinResult){
      ctx.fillStyle='rgba(0,0,0,0.7)'; ctx.fillRect(-180,120,360,120);
      drawText('🎉 获得',0,200,22,'#FFD764');
      drawText(spinResult.label,0,160,32,spinResult.color);
    }
    drawButtons();
  }
  // 升级提示
  if(levelUpFlash>0){
    const a=Math.min(1,levelUpFlash);
    ctx.fillStyle=`rgba(255,215,100,${a*0.2})`;
    ctx.fillRect(-CFG.W/2,-CFG.H/2,CFG.W,CFG.H);
    drawText(`⬆ 升级！Lv.${Save.level}`,0,0,48,'#FFD764');
  }
  // 分享复活提示
  if(reviveHintT>0 && state==='playing'){
    ctx.fillStyle='rgba(40,40,70,0.92)';
    roundRect(ctx,-300,-60,600,120,16); ctx.fill();
    drawText('连续落空了，分享给好友获得自动瞄准辅助！',0,15,22,'#fff');
  }
  // 新手教程引导
  if(tutorialActive && state==='playing'){
    ctx.fillStyle='rgba(0,0,0,0.5)';
    ctx.fillRect(-CFG.W/2,-CFG.H/2,CFG.W,CFG.H);
    // 高亮发射点区域
    ctx.save();
    ctx.globalCompositeOperation='destination-out';
    ctx.beginPath();
    ctx.arc(CFG.launchX, CFG.launchY, 70, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
    // 手指动画
    const t = performance.now()*0.004;
    const fingerY = CFG.launchY + 60 + Math.sin(t)*10;
    ctx.font='50px sans-serif'; ctx.textAlign='center';
    ctx.fillText('👆', CFG.launchX, fingerY);
    // 提示文字
    const tips = {
      1:'按住屏幕蓄力',
      2:'松手发射积木',
      3:'让积木落到平台上'
    };
    const tip = tips[tutorialStep] || '';
    ctx.fillStyle='rgba(0,0,0,0.8)';
    roundRect(ctx,-200, CFG.launchY-130, 400, 56, 14); ctx.fill();
    drawText(tip, 0, CFG.launchY-102, 24, '#FFD764');
    drawText(`步骤 ${tutorialStep}/3`, 0, CFG.launchY-148, 14, '#9bb0d0');
  }
  // 新纪录小提示（不挡操作，自动消失）
  if(newRecordT>0){
    const a = Math.min(1, newRecordT/0.4);
    ctx.globalAlpha = a;
    ctx.fillStyle='rgba(255,215,100,0.95)';
    roundRect(ctx,-130,180,260,56,28); ctx.fill();
    drawText('新纪录！'+hiScore, 0, 208, 26, '#1a1a2e');
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}
function drawText(text,x,y,size,color,align='center'){
  ctx.fillStyle=color;
  ctx.font=`bold ${size}px -apple-system,"PingFang SC",sans-serif`;
  ctx.textAlign=align; ctx.textBaseline='middle';
  ctx.fillText(text,x,y);
}
function drawButtons(){
  for(const b of uiButtons) drawButton(b);
}
function drawButton(b){
  ctx.fillStyle=b.color;
  roundRect(ctx,b.x-b.w/2,b.y-b.h/2,b.w,b.h,b.h/3);
  ctx.fill();
  drawText(b.label,b.x,b.y,Math.floor(b.h*0.42),'#fff');
}
function drawPowerBar(x,y){
  const w=180,h=24;
  ctx.fillStyle='rgba(40,40,60,0.8)';
  roundRect(ctx,x-w/2,y-h/2,w,h,h/2); ctx.fill();
  if(charge>0){
    const fw=(w-4)*charge;
    ctx.fillStyle = charge<0.5?'#4caf50':charge<0.8?'#ffc107':'#f44336';
    roundRect(ctx,x-w/2+2,y-h/2+2,fw,h-4,(h-4)/2); ctx.fill();
  }
}
function drawLeaderboard(){
  const list=leaderboardData.slice().sort((a,b)=>b.s-a.s).slice(0,10);
  drawText('好友最高分',0,190,22,'#c8c8dc');
  for(let i=0;i<list.length;i++){
    const y=150-i*28;
    const it=list[i];
    drawText(`${i+1}`,-240,y,20,'#fff');
    drawText(it.n,-100,y,20,'#ddd');
    drawText(String(it.s),200,y,20,'#FFD764');
  }
}
/* 启动 */
resetPlatforms();
// 环境粒子
for(let i=0;i<40;i++){
  ambient.push({
    x:(Math.random()-0.5)*CFG.W, y:(Math.random()-0.5)*CFG.H,
    r:1+Math.random()*2.5, s:8+Math.random()*20, a:0.15+Math.random()*0.3,
    hue: Math.random()<0.5 ? 260 : 30
  });
}
// 预创建渐变（性能优化：避免每帧创建）
let bgGrad=null, glowGrad1=null, glowGrad2=null;
function initGradients(){
  bgGrad=ctx.createLinearGradient(0,-CFG.H/2,0,CFG.H/2);
  bgGrad.addColorStop(0,'#0d0f1e'); bgGrad.addColorStop(0.5,'#161832'); bgGrad.addColorStop(1,'#1a1030');
  glowGrad1=ctx.createRadialGradient(200,500,0,200,500,320);
  glowGrad1.addColorStop(0,'rgba(140,90,220,0.22)'); glowGrad1.addColorStop(1,'rgba(140,90,220,0)');
  glowGrad2=ctx.createRadialGradient(-200,-300,0,-200,-300,250);
  glowGrad2.addColorStop(0,'rgba(255,110,64,0.10)'); glowGrad2.addColorStop(1,'rgba(255,110,64,0)');
}
initGradients();
requestAnimationFrame(loop);
</script>
